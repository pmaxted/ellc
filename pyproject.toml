[build-system]
requires = [
    "meson-python>=0.17",
    "meson>=1.4",
    "ninja"
]
build-backend = "mesonpy"

[project]
name = "ellc"
version = "1.99.1"
description = "Light curve model for eclipsing binary stars and transiting exoplanets"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.10",
    "astropy>=1.1",
    "scipy",
    "emcee",
    "corner",
    "matplotlib",
]

[project.scripts]
ellc_emcee = "ellc_emcee:main"
